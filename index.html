<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#111318">
<title>Manhwa Tracker v6.2</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0f1115;--panel:#171a21;--panel2:#1d212a;--text:#f4f6fb;--muted:#929baa;
  --line:#2b313d;--accent:#8da7ff;--good:#70d6a8;--warn:#f0c36a;--bad:#ff8787;--purple:#c99cff
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:rgba(15,17,21,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:1060px;margin:auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1{margin:0 0 12px;font-size:27px}
.topbar{display:grid;grid-template-columns:1fr auto auto auto auto;gap:9px}
input,select,button{font:inherit}
input[type=search],select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:10px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
button:hover{border-color:#586274}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.stats{color:var(--muted);font-size:13px;margin-top:9px}
section{margin:24px 0}
.letter{font-size:22px;margin:0 0 8px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:8px 0}
.title{font-weight:700;line-height:1.25}
.title a{color:var(--text);text-decoration:none}
.title a:hover{color:var(--accent);text-decoration:underline}
.row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.statusSelect{padding:5px 8px;font-size:12px;background:var(--panel2);border-radius:999px;min-width:130px}
.note{font-size:12px;color:var(--warn)}
.apiResult{font-size:12px;color:var(--purple);margin-top:6px;min-height:16px}
.sourceLinks{font-size:12px;margin-top:5px}
.sourceLinks a{color:var(--accent);text-decoration:none;margin-right:12px}
.sourceLinks a:hover{text-decoration:underline}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ch{min-width:48px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums}
.pm{width:38px;height:38px;padding:0;font-size:22px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);width:min(92vw,560px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlg{padding:18px}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.danger{border-color:#703b44;color:#ff9aa6}.danger:hover{border-color:#a84b59}.helper{font-size:12px;color:var(--muted);line-height:1.4}
.dashboard{display:flex;flex-direction:column;gap:14px;margin:18px 0 8px}
.dashPanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.dashTitle{font-size:14px;font-weight:700;margin:0 0 9px;color:#dfe5f2}
.quickList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quickCard{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.quickName{font-size:13px;font-weight:700;line-height:1.25}
.quickMeta{font-size:11px;color:var(--muted);margin-top:5px}.showMoreBtn{margin-top:10px;width:100%;font-size:12px;padding:7px 10px}
.starBtn{padding:6px 8px;min-width:38px;font-size:18px;line-height:1}
.starBtn.on{color:#ffd166;border-color:#6e5a28}

.hidden{display:none!important}
@media(max-width:700px){.quickList{grid-template-columns:1fr}.quickCard{min-width:0}
  .wrap{
    padding-top:13px;
    padding-bottom:13px;
    padding-left:max(13px,env(safe-area-inset-left));
    padding-right:max(13px,env(safe-area-inset-right));
  }
  h1{font-size:23px}
  .topbar{grid-template-columns:1fr 1fr}
  .topbar input{grid-column:1/-1}
  .topbar button{min-height:46px}
  .card{grid-template-columns:1fr;padding:14px}
  .title{font-size:17px}
  .controls{justify-content:space-between}
  .pm{width:44px;height:44px}
  .statusSelect{min-width:145px}
}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manhwa Tracker">

</head>
<body>
<header><div class="wrap">
  <h1>Manhwa Tracker <span style="font-size:12px;color:#929baa;font-weight:500">v6.2</span></h1>
  <div class="topbar">
    <input id="search" type="search" placeholder="Search titles, status, notes…">
    <button id="addTitleBtn">+ Add title</button><button id="checkAllBtn">Check statuses</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
  </div>
  <div class="filters">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option>Ongoing</option>
      <option>Hiatus / Season Break</option>
      <option>Completed</option>
      <option>Anime</option>
      <option>Needs verification</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
</div></header>

<div class="wrap"><div class="dashboard">
<div class="dashPanel">
  <div class="dashTitle">★ Favorites</div>
  <div class="quickList" id="favoritesBar"></div>
  <button class="showMoreBtn hidden" id="favoritesMoreBtn">Show all</button>
</div>
<div class="dashPanel">
  <div class="dashTitle">⏱ Recents</div>
  <div class="quickList" id="recentsBar"></div>
  <button class="showMoreBtn hidden" id="recentsMoreBtn">Show all</button>
</div>
</div></div><main class="wrap" id="app"></main>
<input id="importFile" type="file" accept=".json,application/json" class="hidden">

<dialog id="editDialog">
<form method="dialog" class="dlg" id="editForm">
  <h3 id="dlgTitle"></h3>
  <div class="field">
    <label>Chapter</label>
    <input id="dlgChapter" type="number" min="0" step="1">
  </div>
  <div class="field">
    <label>Direct link</label>
    <input id="dlgUrl" type="url" placeholder="https://…">
  </div>
  <div class="field">
    <label>Your personal note</label>
    <input id="dlgNote" type="text" placeholder="Caught up, reread later, favorite arc, etc.">
  </div>
  <div class="actions">
    <button type="button" class="danger" id="deleteTitleBtn">Remove title</button>
    <span style="flex:1"></span>
    <button value="cancel">Cancel</button>
    <button value="default">Save</button>
  </div>
</form>
</dialog>


<dialog id="addDialog">
<form method="dialog" class="dlg" id="addForm">
  <h3>Add a manhwa</h3>
  <div class="field">
    <label>Title</label>
    <input id="addTitle" type="text" required placeholder="Series title">
  </div>
  <div class="field">
    <label>Current chapter</label>
    <input id="addChapter" type="number" min="0" step="1" value="0">
  </div>
  <div class="field">
    <label>Direct link (optional)</label>
    <input id="addUrl" type="url" placeholder="https://…">
  </div>
  <div class="helper">
    New titles start as <b>Needs verification</b>. After adding, the app will try AniList automatically; you can then set the final status from the dropdown.
  </div>
  <div class="actions">
    <button value="cancel">Cancel</button>
    <button value="default">Add</button>
  </div>
</form>
</dialog>

}, {"title": "Warriors Ballad", "chapter": 0, "letter": "W", "note": "", "url": "", "status": "Ongoing"}, {"title": "World’s Strongest Troll", "chapter": 29, "letter": "W", "note": "", "url": "", "status": "Ongoing"}, {"title": "Worn and Torn Newbie", "chapter": 149, "letter": "W", "note": "", "url": "", "status": "Ongoing"}, {"title": "Worthless Regression", "chapter": 86, "letter": "W", "note": "", "url": "", "status": "Ongoing"}];
const KEY="manhwaTracker_v6_2";
const OLDKEYS=["manhwaTracker_v6_1","manhwaTracker_v6","manhwaTracker_v5","manhwaTracker_v4","manhwaTracker_v3","manhwaTracker_v2","manhwaTracker_v1"];
const STATUS_OPTIONS=[
  "Ongoing",
  "Hiatus / Season Break",
  "Completed",
  "Completed • Anime",
  "Ongoing • Anime",
  "Ongoing / Side Stories",
  "Ongoing / Irregular",
  "Hiatus (English)",
  "Needs verification"
];

let saved=JSON.parse(localStorage.getItem(KEY)||"null");
if(!saved){
  let old=null;
  for(const k of OLDKEYS){
    old=JSON.parse(localStorage.getItem(k)||"null");
    if(old) break;
  }
  if(old){
    const byTitle=Object.fromEntries(seed.map(x=>[x.title,x]));
    saved=old
      .filter(x=>!((x.status||"").toLowerCase().includes("cancel")||(x.status||"").toLowerCase().includes("axed")))
      .map(x=>{
        const base=byTitle[x.title]||{};
        return {
          ...base,
          ...x,
          status: base.status || x.status || "Needs verification",
          note: x.note || "",
          url: x.url || "",
          chapter: Number.isFinite(x.chapter) ? x.chapter : (base.chapter||0),
          favorite: Boolean(x.favorite),
          addedAt: x.addedAt || null,
          lastUpdated: x.lastUpdated || null
        };
      });
    // Ensure new seed titles not present in old data still appear.
    const have=new Set(saved.map(x=>x.title));
    for(const x of seed) if(!have.has(x.title)) saved.push(x);
  }
}
let data=(saved||seed).map(x=>({
  ...x,
  favorite:Boolean(x.favorite),
  addedAt:x.addedAt||null,
  lastUpdated:x.lastUpdated||null
}));
let editingIndex=null;
let apiCache={};
let favoritesExpanded=false;
let recentsExpanded=false;

function touch(i){
  if(i!==null && i!==undefined && data[i]) data[i].lastUpdated=Date.now();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function searchUrl(t){return "https://www.google.com/search?q="+encodeURIComponent(t+" manhwa official")}
function deriveLetter(t){const m=(t||"").trim().match(/[A-Za-z0-9]/);return m?m[0].toUpperCase():"#"}
function mangaUpdatesUrl(t){return "https://www.mangaupdates.com/search.html?search="+encodeURIComponent(t)}
function anilistUrl(t){return "https://anilist.co/search/manga?search="+encodeURIComponent(t)}
function mapAniStatus(s){return s==="RELEASING"?"Ongoing":s==="FINISHED"?"Completed":s==="CANCELLED"?"Cancelled":s==="HIATUS"?"Hiatus / Season Break":s||"Unknown"}

async function checkAniList(title){
  const q=`query ($search:String){Media(search:$search,type:MANGA){id status title{romaji english native} siteUrl}}`;
  const r=await fetch("https://graphql.anilist.co",{
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify({query:q,variables:{search:title}})
  });
  if(!r.ok) throw new Error("AniList HTTP "+r.status);
  const j=await r.json();
  return j?.data?.Media||null;
}

async function checkOne(i){
  const x=data[i], el=document.getElementById("api-"+i);
  if(el) el.textContent="Checking AniList…";
  try{
    const m=await checkAniList(x.title);
    if(!m) throw new Error("No match");
    apiCache[x.title]=m;
    if(el) el.textContent=`AniList says: ${mapAniStatus(m.status)} • matched “${m.title.english||m.title.romaji||m.title.native}”`;
  }catch(e){
    if(el) el.textContent="No clean AniList match. Use the source links, then change the dropdown manually.";
  }
}


async function addTitleFromForm(){
  const title=document.getElementById("addTitle").value.trim();
  if(!title) return;
  const duplicate=data.find(x=>x.title.toLowerCase()===title.toLowerCase());
  if(duplicate){
    alert("That title is already in your tracker.");
    return;
  }
  const chapter=Math.max(0,parseInt(document.getElementById("addChapter").value||"0",10));
  const url=document.getElementById("addUrl").value.trim();
  data.push({
    title,
    chapter,
    letter:deriveLetter(title),
    status:"Needs verification",
    note:"",
    favorite:false,
    addedAt:Date.now(),
    lastUpdated:Date.now(),
    url
  });
  localStorage.setItem(KEY,JSON.stringify(data));
  document.getElementById("addDialog").close();
  render();
  const idx=data.length-1;
  await checkOne(idx);
}

async function checkAll(){
  const btn=document.getElementById("checkAllBtn");
  btn.disabled=true; btn.textContent="Checking…";
  const targets=data.map((x,i)=>[x,i]).filter(([x])=>x.status==="Needs verification").slice(0,40);
  for(const [x,i] of targets){
    await checkOne(i);
    await new Promise(r=>setTimeout(r,350));
  }
  btn.disabled=false; btn.textContent="Check statuses";
  alert(`Checked ${targets.length} unverified titles. Use the status dropdown after reviewing the match.`);
}

function makeStatusSelect(x){
  const s=document.createElement("select");
  s.className="statusSelect";
  const opts=[...STATUS_OPTIONS];
  if(x.status && !opts.includes(x.status)) opts.unshift(x.status);
  for(const val of opts){
    const o=document.createElement("option");
    o.value=val; o.textContent=val;
    if(val===x.status) o.selected=true;
    s.appendChild(o);
  }
  s.onchange=()=>{
    data[x._i].status=s.value;
    touch(x._i);
    persist();
  };
  return s;
}


function renderQuickBars(){
  const favBox=document.getElementById("favoritesBar");
  const recBox=document.getElementById("recentsBar");
  const favBtn=document.getElementById("favoritesMoreBtn");
  const recBtn=document.getElementById("recentsMoreBtn");
  if(!favBox||!recBox) return;

  const favs=data.map((x,i)=>({...x,_i:i}))
    .filter(x=>x.favorite)
    .sort((a,b)=>(b.lastUpdated||0)-(a.lastUpdated||0) || a.title.localeCompare(b.title));

  const recents=data.map((x,i)=>({...x,_i:i}))
    .filter(x=>x.lastUpdated)
    .sort((a,b)=>(b.lastUpdated||0)-(a.lastUpdated||0));

  const fill=(box,items,emptyText,expanded)=>{
    box.innerHTML="";
    const shown=expanded?items:items.slice(0,3);
    if(!shown.length){
      const e=document.createElement("div");
      e.className="quickMeta";
      e.textContent=emptyText;
      box.appendChild(e);
      return;
    }
    for(const x of shown){
      const q=document.createElement("div"); q.className="quickCard";
      const name=document.createElement("div"); name.className="quickName";
      const a=document.createElement("a");
      a.href=x.url||searchUrl(x.title); a.target="_blank"; a.rel="noopener";
      a.textContent=x.title; a.style.color="inherit"; a.style.textDecoration="none";
      name.appendChild(a);
      const meta=document.createElement("div"); meta.className="quickMeta";
      meta.textContent=`Ch. ${x.chapter??0} • ${x.status||"Needs verification"}`;
      q.append(name,meta);
      box.appendChild(q);
    }
  };

  fill(favBox,favs,"Star a title to pin it here.",favoritesExpanded);
  fill(recBox,recents,"Change a chapter, status, note, or add a title to see it here.",recentsExpanded);

  if(favs.length>3){
    favBtn.classList.remove("hidden");
    favBtn.textContent=favoritesExpanded?`Show top 3`:`Show all (${favs.length})`;
  }else{
    favBtn.classList.add("hidden");
  }

  if(recents.length>3){
    recBtn.classList.remove("hidden");
    recBtn.textContent=recentsExpanded?`Show top 3`:`Show all (${recents.length})`;
  }else{
    recBtn.classList.add("hidden");
  }
}

function render(){
  renderQuickBars();
  const q=document.getElementById("search").value.trim().toLowerCase();
  const f=document.getElementById("statusFilter").value.toLowerCase();
  const app=document.getElementById("app");
  app.innerHTML="";

  const visible=data.map((x,i)=>({...x,_i:i})).filter(x=>{
    const hay=[x.title,x.status,x.note].join(" ").toLowerCase();
    return(!q||hay.includes(q))&&(!f||(x.status||"").toLowerCase().includes(f));
  });

  const groups={};
  visible.forEach(x=>(groups[x.letter]||=[]).push(x));

  Object.keys(groups).sort().forEach(letter=>{
    const sec=document.createElement("section");
    const h=document.createElement("h2");
    h.className="letter"; h.textContent=letter;
    sec.appendChild(h);

    groups[letter].sort((a,b)=>a.title.localeCompare(b.title)).forEach(x=>{
      const c=document.createElement("div"); c.className="card";
      const left=document.createElement("div");

      const t=document.createElement("div"); t.className="title";
      const a=document.createElement("a");
      a.href=x.url||searchUrl(x.title); a.target="_blank"; a.rel="noopener"; a.textContent=x.title;
      t.appendChild(a); left.appendChild(t);

      const row2=document.createElement("div"); row2.className="row2";
      row2.appendChild(makeStatusSelect(x));
      if(x.note){
        const n=document.createElement("span");
        n.className="note"; n.textContent="Your note: "+x.note;
        row2.appendChild(n);
      }
      left.appendChild(row2);

      const api=document.createElement("div");
      api.className="apiResult"; api.id="api-"+x._i;
      if(apiCache[x.title]){
        const m=apiCache[x.title];
        api.textContent=`AniList says: ${mapAniStatus(m.status)} • matched “${m.title.english||m.title.romaji||m.title.native}”`;
      }
      left.appendChild(api);

      const src=document.createElement("div"); src.className="sourceLinks";
      src.innerHTML=`<a target="_blank" rel="noopener" href="${anilistUrl(x.title)}">AniList</a><a target="_blank" rel="noopener" href="${mangaUpdatesUrl(x.title)}">MangaUpdates</a>`;
      left.appendChild(src);

      const controls=document.createElement("div"); controls.className="controls";
      const minus=document.createElement("button"); minus.className="pm"; minus.textContent="−";
      minus.onclick=()=>{data[x._i].chapter=Math.max(0,(data[x._i].chapter||0)-1);touch(x._i);persist()};
      const ch=document.createElement("div"); ch.className="ch"; ch.textContent=x.chapter??0;
      const plus=document.createElement("button"); plus.className="pm"; plus.textContent="+";
      plus.onclick=()=>{data[x._i].chapter=(data[x._i].chapter||0)+1;touch(x._i);persist()};
      const star=document.createElement("button"); star.className="starBtn"+(x.favorite?" on":""); star.textContent=x.favorite?"★":"☆"; star.title=x.favorite?"Remove from favorites":"Add to favorites"; star.onclick=()=>{data[x._i].favorite=!data[x._i].favorite; touch(x._i); persist()};
      const chk=document.createElement("button"); chk.textContent="Check"; chk.onclick=()=>checkOne(x._i);
      const edit=document.createElement("button"); edit.textContent="Edit"; edit.onclick=()=>openEdit(x._i);
      controls.append(star,minus,ch,plus,chk,edit);

      c.append(left,controls);
      sec.appendChild(c);
    });
    app.appendChild(sec);
  });

  const counts={};
  data.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);
  const hiatusCount=Object.entries(counts).filter(([k])=>k.toLowerCase().includes("hiatus")).reduce((a,[,v])=>a+v,0);
  const completedCount=Object.entries(counts).filter(([k])=>k.toLowerCase().includes("completed")).reduce((a,[,v])=>a+v,0);
  const ongoingCount=Object.entries(counts).filter(([k])=>k.toLowerCase().includes("ongoing")).reduce((a,[,v])=>a+v,0);
  document.getElementById("stats").textContent=`${visible.length} shown • ${data.length} total • ${ongoingCount} ongoing • ${hiatusCount} hiatus • ${completedCount} completed`;
}

function openEdit(i){
  editingIndex=i;
  const x=data[i];
  document.getElementById("dlgTitle").textContent=x.title;
  document.getElementById("dlgChapter").value=x.chapter??0;
  document.getElementById("dlgUrl").value=x.url||"";
  document.getElementById("dlgNote").value=x.note||"";
  document.getElementById("editDialog").showModal();
}

document.getElementById("editForm").addEventListener("submit",e=>{
  if(!e.submitter||e.submitter.value==="cancel") return;
  e.preventDefault();
  const x=data[editingIndex];
  x.chapter=Math.max(0,parseInt(document.getElementById("dlgChapter").value||"0",10));
  x.url=document.getElementById("dlgUrl").value.trim();
  x.note=document.getElementById("dlgNote").value.trim();
  touch(editingIndex);
  document.getElementById("editDialog").close();
  persist();
});


document.getElementById("addTitleBtn").onclick=()=>{
  document.getElementById("addTitle").value="";
  document.getElementById("addChapter").value="0";
  document.getElementById("addUrl").value="";
  document.getElementById("addDialog").showModal();
};
document.getElementById("addForm").addEventListener("submit",async e=>{
  if(!e.submitter||e.submitter.value==="cancel") return;
  e.preventDefault();
  await addTitleFromForm();
});
document.getElementById("deleteTitleBtn").onclick=()=>{
  if(editingIndex===null) return;
  const x=data[editingIndex];
  if(confirm(`Remove "${x.title}" from this device's tracker?`)){
    data.splice(editingIndex,1);
    editingIndex=null;
    document.getElementById("editDialog").close();
    persist();
  }
};


document.getElementById("favoritesMoreBtn").onclick=()=>{
  favoritesExpanded=!favoritesExpanded;
  renderQuickBars();
};
document.getElementById("recentsMoreBtn").onclick=()=>{
  recentsExpanded=!recentsExpanded;
  renderQuickBars();
};

document.getElementById("search").addEventListener("input",render);
document.getElementById("statusFilter").addEventListener("change",render);
document.getElementById("checkAllBtn").onclick=checkAll;

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="manhwa-tracker-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const imported=JSON.parse(await f.text());
    if(!Array.isArray(imported)) throw 0;
    const byTitle=Object.fromEntries(seed.map(x=>[x.title,x]));
    data=imported
      .filter(x=>!((x.status||"").toLowerCase().includes("cancel")||(x.status||"").toLowerCase().includes("axed")))
      .map(x=>({
        ...(byTitle[x.title]||{}),
        ...x,
        status:x.status||byTitle[x.title]?.status||"Needs verification",
        note:x.note||"",
        url:x.url||"",
        favorite:Boolean(x.favorite),
        addedAt:x.addedAt||null,
        lastUpdated:x.lastUpdated||null
      }));
    persist();
    alert("Tracker imported.");
  }catch{
    alert("Invalid tracker backup.");
  }
  e.target.value="";
});

render();
</script>
